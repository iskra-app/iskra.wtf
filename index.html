<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iskra</title>
  <meta name="description" content="Iskra — Matrix-клиент для iPhone, iPad и Mac. Скоро.">
  <meta name="color-scheme" content="light dark">
  <meta property="og:title" content="Iskra">
  <meta property="og:description" content="Matrix-клиент для iPhone, iPad и Mac. Скоро.">
  <meta property="og:image" content="https://iskra.wtf/icon.png">
  <meta property="og:url" content="https://iskra.wtf/">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg: #faf8f5;
      --fg: #1c1b1a;
      --muted: #6e6a65;
      --line: #e4e0da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121110;
        --fg: #f2efea;
        --muted: #9a958e;
        --line: #2a2826;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      text-align: center;
    }
    main { max-width: 32rem; }
    img {
      width: 120px;
      height: 120px;
      display: block;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 40px;
      line-height: 1.1;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 8px; }
    .soon { color: var(--muted); }
    .en {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 15px;
    }
    a { color: inherit; }
    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="" width="120" height="120">
    <h1>Iskra</h1>
    <p>Matrix-клиент для iPhone, iPad и&nbsp;Mac.</p>
    <p class="soon">Скоро здесь будет сайт.</p>
    <div class="en" lang="en">
      <p>Iskra is a Matrix client for iPhone, iPad and&nbsp;Mac.<br>A website is coming soon.</p>
    </div>
  </main>
  <footer>
    <a href="https://github.com/iskra-app">github.com/iskra-app</a>
  </footer>
</body>
</html>
